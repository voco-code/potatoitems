name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
      - run: |
          cd "$(dirname "$(find . -name gradlew -not -path './.git/*' | head -n 1)")"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-legendary-mod
          path: '**/build/libs/*.jar'
